<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;650;750;850&display=swap" rel="stylesheet">
  <title>Casa · AquaNim</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #e9e4dc;
      --panel: #f8f5ef;
      --panel-2: #eee9df;
      --ink: #282a2d;
      --muted: #65605a;
      --line: #cec5b8;
      --accent: #a84f36;
      --accent-ink: #fff9f2;
      --selected: #f0b544;
      --danger: #a43d39;
      --shadow: rgba(47, 38, 30, .16);
      --canvas-edge: #bbb0a0;
      --button: #fffdf8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #1e2022;
        --panel: #292c2e;
        --panel-2: #343739;
        --ink: #f5efe7;
        --muted: #c5bdb3;
        --line: #505254;
        --accent: #d77655;
        --accent-ink: #201914;
        --selected: #f2bf55;
        --danger: #df716c;
        --shadow: rgba(0, 0, 0, .34);
        --canvas-edge: #4a4947;
        --button: #36393b;
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: "Nunito Sans", ui-rounded, sans-serif;
      background: var(--page);
      color: var(--ink);
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto minmax(340px, 1fr) auto;
      gap: 10px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .mode {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 750;
    }
    .mode-dot {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
      background: var(--accent);
      border: 2px solid var(--panel);
      outline: 1px solid var(--accent);
      border-radius: 50%;
    }
    #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tools { display: flex; gap: 7px; align-items: center; }
    .tool-btn, .lang-btn {
      min-height: 42px;
      border: 1px solid var(--line);
      background: var(--button);
      color: var(--ink);
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--shadow);
    }
    .tool-btn:hover, .lang-btn:hover { border-color: var(--accent); }
    .tool-btn:active, .lang-btn:active { transform: translateY(1px); box-shadow: none; }
    .tool-btn:disabled { opacity: .42; cursor: default; transform: none; }
    .tool-btn.icon { width: 44px; padding: 6px; font-size: 21px; line-height: 1; }
    .tool-btn.danger:not(:disabled) { color: var(--danger); }
    .lang-btn { min-width: 51px; }
    .gold-hud {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 42px;
      border: 1px solid var(--line);
      background: var(--button);
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 0 var(--shadow);
      white-space: nowrap;
    }
    .catalog-item .price { color: var(--accent); font-weight: 850; }
    .canvas-shell {
      position: relative;
      min-height: 340px;
      border: 1px solid var(--canvas-edge);
      background: #25282a;
      border-radius: 14px 14px 7px 7px;
      overflow: hidden;
      box-shadow: 0 10px 24px var(--shadow);
      isolation: isolate;
    }
    canvas#room {
      width: 100%;
      height: 100%;
      min-height: 340px;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }
    .hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: min(390px, calc(100% - 24px));
      padding: 8px 11px;
      background: rgba(31, 33, 35, .86);
      color: #fff9f0;
      font-size: 13px;
      font-weight: 650;
      border-radius: 8px;
      pointer-events: none;
      transition: opacity .2s;
    }
    .play-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .joystick {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 116px;
      height: 116px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 50%;
      background: rgba(28,31,33,.58);
      box-shadow: inset 0 0 0 12px rgba(255,255,255,.05), 0 5px 18px rgba(0,0,0,.18);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }
    .joystick::before, .joystick::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,.24);
      border-radius: 2px;
      pointer-events: none;
    }
    .joystick::before { width: 2px; height: 72px; left: 57px; top: 22px; }
    .joystick::after { width: 72px; height: 2px; left: 22px; top: 57px; }
    .joystick-knob {
      position: absolute;
      width: 48px;
      height: 48px;
      left: 34px;
      top: 34px;
      border-radius: 50%;
      background: #fff8eb;
      border: 2px solid #b96648;
      box-shadow: 0 4px 10px rgba(0,0,0,.3);
      pointer-events: none;
    }
    .sit-btn {
      position: absolute;
      right: 18px;
      bottom: 146px;
      min-height: 46px;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 12px;
      padding: 8px 13px;
      color: #27241f;
      background: #fff8e8;
      box-shadow: 0 5px 14px rgba(0,0,0,.24);
      font-weight: 850;
      pointer-events: auto;
      cursor: pointer;
    }
    .play-controls[hidden], .sit-btn[hidden] { display: none; }
    body.play-mode .bottom-panel { display: none; }
    body.play-mode .app { grid-template-rows: auto minmax(430px, 1fr); }
    body.play-mode canvas#room { cursor: pointer; }
    .mode-switch { min-width: 94px; }
    .toast {
      position: absolute;
      top: 12px;
      left: 50%;
      translate: -50% 0;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 24px);
      padding: 9px 12px;
      border-radius: 9px;
      background: #fff8e8;
      color: #33281f;
      border: 1px solid #d4b77b;
      box-shadow: 0 5px 18px rgba(0,0,0,.2);
      font-weight: 750;
      z-index: 3;
    }
    .toast[hidden] { display: none; }
    .toast button { border: 0; background: #3d342b; color: #fff; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
    .bottom-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px 8px 14px 14px;
      box-shadow: 0 7px 18px var(--shadow);
      overflow: hidden;
    }
    .action-row {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }
    .action-row .spacer { flex: 1; }
    .action-row .tool-btn { min-height: 38px; padding: 6px 11px; }
    .catalog-wrap { padding: 8px; }
    .catalog-tabs { display: flex; gap: 5px; margin: 0 2px 7px; }
    .catalog-tab {
      min-height: 36px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 850;
      cursor: pointer;
    }
    .catalog-tab:hover { color: var(--ink); border-color: var(--accent); }
    .catalog-tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .catalog-label { font-size: 12px; font-weight: 850; color: var(--muted); margin: 0 4px 6px; }
    .catalog {
      display: grid;
      grid-template-columns: repeat(12, minmax(74px, 1fr));
      gap: 6px;
    }
    .catalog-item {
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      border-radius: 9px;
      padding: 3px 2px 6px;
      cursor: pointer;
      text-align: center;
    }
    .catalog-item:hover { background: var(--panel-2); }
    .catalog-item.active {
      background: color-mix(in srgb, var(--selected) 22%, var(--panel));
      border-color: var(--selected);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--selected) 65%, transparent);
    }
    .catalog-item canvas, .catalog-item img { width: 68px; height: 49px; max-width: 100%; display: block; margin: 0 auto 1px; object-fit: contain; image-rendering: auto; }
    .catalog-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 750; }
    .save-state { font-size: 12px; color: var(--muted); font-weight: 750; min-width: 76px; text-align: right; white-space: nowrap; }
    .login-overlay { position: fixed; inset: 0; background: rgba(20,18,16,.74); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .login-overlay[hidden] { display: none; }
    .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 30px; max-width: 380px; text-align: center; box-shadow: 0 8px 30px var(--shadow); }
    .login-card p { margin: 0 0 16px; font-weight: 650; }
    .login-card a { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 10px 22px; font-weight: 800; text-decoration: none; }
    @media (max-width: 780px) {
      .app { padding: 8px 8px calc(12px + env(safe-area-inset-bottom)); grid-template-rows: auto minmax(310px, 57vh) auto; }
      .mode { font-size: 13px; }
      .tool-btn.texty { display: none; }
      .canvas-shell { min-height: 310px; border-radius: 10px 10px 5px 5px; }
      canvas#room { min-height: 310px; }
      .bottom-panel { border-radius: 6px 6px 11px 11px; }
      .catalog { grid-template-columns: repeat(6, minmax(48px, 1fr)); gap: 4px; }
      .catalog-item canvas, .catalog-item img { width: 55px; height: 39px; }
      .catalog-item span { font-size: 10px; }
      .catalog-wrap { padding: 6px; }
      .action-row { padding: 7px; flex-wrap: wrap; }
      .action-row .tool-btn { flex: 1; padding: 6px 5px; font-size: 12px; }
      .action-row .spacer { display: none; }
      .hint { font-size: 12px; bottom: 8px; left: 8px; max-width: calc(100% - 150px); }
      .joystick { width: 96px; height: 96px; right: 12px; bottom: 12px; }
      .joystick::before { height: 62px; left: 47px; top: 17px; }
      .joystick::after { width: 62px; left: 17px; top: 47px; }
      .joystick-knob { width: 42px; height: 42px; left: 27px; top: 27px; }
      .sit-btn { right: 12px; bottom: 118px; }
      body.play-mode .app { grid-template-rows: auto minmax(420px, calc(100vh - 78px)); }
    }
    @media (max-width: 430px) {
      .catalog { grid-template-columns: repeat(4, minmax(54px, 1fr)); }
      .topbar { gap: 5px; }
      .tools { gap: 4px; }
      .tool-btn.icon { width: 40px; }
      .lang-btn { min-width: 45px; padding-inline: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="mode"><span class="mode-dot"></span><span id="status">Escolha um móvel abaixo</span></div>
      <div class="tools">
        <button class="tool-btn" id="backBtn" aria-label="Back">← <span data-t="back">Voltar</span></button>
        <span class="gold-hud" id="goldHud" aria-label="Gold">🪙 <span id="goldVal">2000</span></span>
        <button class="tool-btn" id="saveBtn">💾 <span data-t="save">Salvar</span></button>
        <button class="tool-btn mode-switch" id="modeBtn">✎ <span id="modeBtnText">Editar</span></button>
        <button class="tool-btn icon" id="mirrorTop" disabled aria-label="Espelhar">↩️</button>
        <button class="tool-btn icon danger" id="deleteTop" disabled aria-label="Excluir">×</button>
        <button class="lang-btn" id="langBtn" aria-label="Change language">EN</button>
      </div>
    </div>

    <section class="canvas-shell" aria-label="Quarto isométrico decorável">
      <canvas id="room" width="900" height="620" tabindex="0" role="application" aria-label="Área do quarto: toque no piso para colocar o item selecionado"></canvas>
      <div class="hint" id="hint">Toque no piso para caminhar ou use o controle.</div>
      <div class="play-controls" id="playControls">
        <button class="sit-btn" id="sitBtn" hidden>🪑 <span id="sitBtnText">Sentar</span></button>
        <div class="joystick" id="joystick" role="button" aria-label="Controle de movimento" tabindex="0"><span class="joystick-knob" id="joystickKnob"></span></div>
      </div>
      <div class="toast" id="toast" hidden><span id="toastText"></span><button id="undoBtn" hidden>Desfazer</button></div>
    </section>

    <section class="bottom-panel">
      <div class="action-row">
        <button class="tool-btn" id="mirrorBtn" disabled>↩️ <span data-t="mirror">Espelhar</span></button>
        <button class="tool-btn danger" id="deleteBtn" disabled>× <span data-t="delete">Excluir</span></button>
        <div class="spacer"></div>
        <span class="save-state" id="saveState"></span>
        <button class="tool-btn" id="clearBtn"><span data-t="clear">Limpar quarto</span></button>
      </div>
      <div class="catalog-wrap">
        <div class="catalog-tabs" role="tablist" aria-label="Categorias de móveis">
          <button class="catalog-tab active" id="oceanTab" role="tab" aria-selected="true" data-category="ocean">Oceano</button>
          <button class="catalog-tab" id="aquaTab" role="tab" aria-selected="false" data-category="aqua">Aquários</button>
          <button class="catalog-tab" id="woodTab" role="tab" aria-selected="false" data-category="wood">Madeira</button>
        </div>
        <p class="catalog-label" id="catalogLabel">CATÁLOGO · PISO E PAREDE</p>
        <div class="catalog" id="catalog" role="tabpanel"></div>
      </div>
    </section>
  </main>
  <div class="login-overlay" id="loginOverlay" hidden>
    <div class="login-card">
      <p data-t="loginNeeded">Entre no AquaNim para usar sua Casa 🏠</p>
      <a href="/" data-t="loginGo">Ir para o jogo</a>
    </div>
  </div>

  function canPlace(type,x,y,rot,ignoreId){
    var f=footprint(type,rot);
    if(x<0||y<0||x+f.w>ROOM||y+f.d>ROOM)return false;
    var layer=TYPES[type].layer;
    for(var i=0;i<items.length;i++){
      var it=items[i];if(it.id===ignoreId||TYPES[it.type].layer==='wall')continue;
      var il=TYPES[it.type].layer;if(layer==='rug'&&il!=='rug'||layer!=='rug'&&il==='rug')continue;
      var q=footprint(it.type,it.rot||0);
      if(x<it.x+q.w&&x+f.w>it.x&&y<it.y+q.d&&y+f.d>it.y)return false;
    }

  }
  function hitItem(p){

      var aw=al==='wall'?2000:al==='rug'?-1000:a.x+a.y, bw=bl==='wall'?2000:bl==='rug'?-1000:b.x+b.y;return bw-aw;
    });
    for(var i=0;i<sorted.length;i++){
      var b=sorted[i]._bounds;if(b&&p.x>=b.x0&&p.x<=b.x1&&p.y>=b.y0&&p.y<=b.y1)return sorted[i];
    }
    return null;
  }
  function wallFromPoint(p){
    var best=null;
    for(var sideIndex=0;sideIndex<2;sideIndex++){
      var side=sideIndex===0?'right':'left';
      for(var tile=0;tile<ROOM;tile++) for(var row=1;row<=3;row++){
        var base=side==='right'?iso(tile+.5,0,0):iso(0,tile+.5,0);
        var a=[base[0]-metrics.tw*.27,base[1]-metrics.th*.35-row*metrics.wallH/4];
        var b=[base[0]+metrics.tw*.27,base[1]+metrics.th*.35-row*metrics.wallH/4];
        var d=Math.hypot(p.x-(a[0]+b[0])/2,p.y-(a[1]+b[1])/2);
        if(d<metrics.tw*.52&&(!best||d<best.d))best={wall:side,tile:tile,z:row,d:d};
      }
    }
    return best;
  }
  function wallOccupied(wall,tile,z,ignoreId){

  // Server persistence: the whole layout (items + avatar) auto-saves to
  // POST /api/house/save, debounced 2s after each change.

      if (el) el.textContent = r.ok ? t('saved') : '';

  function scheduleSave() {

  }
  // Validate + normalize a layout object (shared shape with the old
  // download/upload format) and install it as the current room.
  function applyLayout(d) {
    var idMap = {};
    var clean = d.items.filter(function (i) { return i && TYPES[i.type]; }).map(function (i) {
      var newId = nextId++; idMap[String(i.id)] = newId;
      var z = { id: newId, type: i.type, rot: ((Number(i.rot) || 0) % 4 + 4) % 4, flip: !!i.flip, angle: ((Number(i.angle) || 0) % 360 + 360) % 360 };
      // Preserve the tank identity (tier + instance number) so saves don't
      // collapse every aquarium of the same art into a duplicate instance.
      if (typeof i.tank_tier === 'string') z.tank_tier = i.tank_tier;
      if (i.tank_num != null) z.tank_num = Math.min(3, Math.max(1, parseInt(i.tank_num) || 1));
      if (TYPES[i.type].layer === 'wall') {
        z.wall = i.wall === 'right' ? 'right' : 'left';
        z.tile = Math.max(0, Math.min(9, Number(i.tile) || 0));
        z.z = Math.max(1, Math.min(3, Number(i.z) || 1));
      } else {
        var fp = footprint(i.type, z.rot);
        z.x = Math.max(0, Math.min(ROOM - fp.w, Number(i.x) || 0));
        z.y = Math.max(0, Math.min(ROOM - fp.d, Number(i.y) || 0));
      }
      return z;
    });
    items = [];
    clean.forEach(function (z) {
      if (TYPES[z.type].layer === 'wall') {
        if (!wallOccupied(z.wall, z.tile, z.z, null)) items.push(z);
      } else if (canPlace(z.type, z.x, z.y, z.rot, null)) items.push(z);
    });
    if (d.avatar && typeof d.avatar === 'object') {
      var ax = Number(d.avatar.x), ay = Number(d.avatar.y);
      avatar.x = Number.isFinite(ax) ? Math.max(.08, Math.min(ROOM - .08, ax)) : 8.5;
      avatar.y = Number.isFinite(ay) ? Math.max(.08, Math.min(ROOM - .08, ay)) : 8.5;
      avatar.facing = Number(d.avatar.facing) < 0 ? -1 : 1;
      avatar.north = !!d.avatar.north; avatar.sitting = !!d.avatar.sitting;
      avatar.seatId = idMap[String(d.avatar.seatId)] || null;
      avatar.path = []; avatar.target = null; avatar.moving = false;
      syncAvatarSeat();
      if (!avatar.sitting && avatarTileBlocked(Math.floor(avatar.x), Math.floor(avatar.y))) {
        var free = nearestFreeTile(avatar.x, avatar.y);
        avatar.x = free.x + .5; avatar.y = free.y + .5;
      }
    }
    if (Number.isFinite(Number(d.nextId))) nextId = Math.max(nextId, Math.floor(Number(d.nextId)));
    selectedId = null; selectedType = null;
  }
  // Boot: load coins + saved layout from the server. 401 -> login overlay.
  function loadHouse(done) {
    apiGet('/api/house').then(function (r) {
      if (!r.ok) {
        if (r.status === 401) document.getElementById('loginOverlay').hidden = false;
        done();
        return;
      }
      gold = Math.max(0, Math.floor(Number(r.coins) || 0));
      if(r.tanks)ownedTanks=r.tanks;
      if(r.tank_fish)tankFish=r.tank_fish;
      var d = r.layout;
      if (d && d.roomDecorator === 1 && Array.isArray(d.items)) applyLayout(d);
      done();
    });
  }
  function deleteSelected(){
    if(selectedId==null)return;
    var it=items.find(function(i){return i.id===selectedId});
    if(it){
      var hk=houseTankOf(it);
      if(hk.tier&&((tankFish[hk.tier+':'+hk.num]||0)>0)){showToast(t('tankHasFish'));return;}
    }
    items=items.filter(function(i){return i.id!==selectedId});selectedId=null;updateUI();draw();scheduleSave();
  }
  function mirrorSelected(){
    var it=items.find(function(i){return i.id===selectedId});if(!it)return;
    it.flip=!it.flip;
    // Aquariums get a fixed angle when mirrored, matching their isometric
    // lean on the other side: large 10°, medium 7°, cube 4°.
    var MIRROR_ANGLE={large:10,medium:7,cube:4};
    var am=it.type.match(/^aq_aquarium_(large|medium|cube)_/);
    if(am){it.angle=MIRROR_ANGLE[am[1]];updateUI();}
    draw();scheduleSave();
  }
  ['mirrorBtn','mirrorTop'].forEach(function(id){document.getElementById(id).addEventListener('click',mirrorSelected)});
  ['deleteBtn','deleteTop'].forEach(function(id){document.getElementById(id).addEventListener('click',deleteSelected)});
  document.getElementById('langBtn').addEventListener('click',function(){lang=lang==='pt'?'en':'pt';translateUI();draw();});
  document.querySelectorAll('.catalog-tab').forEach(function(tab){tab.addEventListener('click',function(){catalogCategory=tab.dataset.category;renderCatalog();});});
  document.getElementById('clearBtn').addEventListener('click',function(){
    if(!items.length)return;
    // Don't clear tanks that have fish — same protection as delete.
    var blocked=items.some(function(i){var hk=houseTankOf(i);return hk.tier&&((tankFish[hk.tier+':'+hk.num]||0)>0);});
    if(blocked){showToast(t('tankHasFish'));return;}
    lastCleared=JSON.parse(JSON.stringify(items));items=[];selectedId=null;selectedType=null;selectedTier=null;updateUI();renderCatalog();draw();showToast(t('cleared'),true);scheduleSave();
  });
  undoBtn.addEventListener('click',function(){if(lastCleared){items=lastCleared;lastCleared=null;nextId=Math.max.apply(null,items.map(function(i){return i.id}).concat([0]))+1;draw();showToast(t('restored'));scheduleSave();}});

  modeBtn.addEventListener('click',function(){setMode(appMode==='play'?'edit':'play');});
  document.getElementById('backBtn').addEventListener('click',function(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}saveHouse().then(function(){location.href='/';});});
  document.getElementById('saveBtn').addEventListener('click',function(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}saveHouse();showToast(t('saving'));});
  sitBtn.addEventListener('click',function(ev){ev.stopPropagation();sitOrStand();});
  window.addEventListener('keydown',function(ev){
    var k=ev.key.length===1?ev.key.toLowerCase():ev.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d'].indexOf(k)<0)return;
    if(appMode==='play'){ev.preventDefault();keys[k]=true;if(avatar.sitting)stopSitting();avatar.path=[];avatar.target=null;}
  });
  window.addEventListener('keyup',function(ev){var k=ev.key.length===1?ev.key.toLowerCase():ev.key;keys[k]=false;});
  function updateJoystick(ev){
    var r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=ev.clientX-cx,dy=ev.clientY-cy,max=r.width*.31,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max;}
    joystickKnob.style.transform='translate('+dx+'px,'+dy+'px)';joystickDir={x:dx/max,y:dy/max};if(avatar.sitting)stopSitting();
  }
  joystick.addEventListener('pointerdown',function(ev){ev.preventDefault();joystickPointer=ev.pointerId;joystick.setPointerCapture(ev.pointerId);updateJoystick(ev);});
  joystick.addEventListener('pointermove',function(ev){if(ev.pointerId===joystickPointer)updateJoystick(ev);});
  function releaseJoystick(ev){if(ev.pointerId!==joystickPointer)return;joystickPointer=null;joystickDir=null;joystickKnob.style.transform='';}
  joystick.addEventListener('pointerup',releaseJoystick);joystick.addEventListener('pointercancel',releaseJoystick);
  joystick.addEventListener('keydown',function(ev){var map={ArrowLeft:'a',ArrowRight:'d',ArrowUp:'w',ArrowDown:'s'};if(map[ev.key]){ev.preventDefault();keys[map[ev.key]]=true;}});
  joystick.addEventListener('keyup',function(ev){var map={ArrowLeft:'a',ArrowRight:'d',ArrowUp:'w',ArrowDown:'s'};if(map[ev.key])keys[map[ev.key]]=false;});

  var mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',draw);
  window.addEventListener('resize',resize);
  loadHouse(function(){updateGold();renderCatalog();translateUI();setMode('play');resize();requestAnimationFrame(animateAvatar);});
})();
</script>
</body>
